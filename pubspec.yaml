name: poost_media_buying_os
description: poost Media Buying OS - complete offline-first Android prototype
publish_to: "none"
version: 1.0.0+4
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1
  fl_chart: ^0.69.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#070D18"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true
  assets:
    - assets/poost_brand.png
    - assets/app_icon.png
