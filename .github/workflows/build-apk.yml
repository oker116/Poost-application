name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate missing android/ platform folder
        run: flutter create --platforms=android .
      - run: flutter pub get
      - name: Add missing INTERNET permission to release manifest
        run: sed -i '1a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Generate app icon from brand asset
        run: dart run flutter_launcher_icons
      - run: flutter analyze
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: poost-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
